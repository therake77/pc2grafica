[project]
name = "kanji-cnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "therake77", email = "jarema9125@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.3",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
kanji-cnn = "kanji_cnn.main:main"
kanji-compare = "kanji_cnn.compare:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
