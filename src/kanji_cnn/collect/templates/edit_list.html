<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{{ writer }} · editar dibujos</title>
    <style>
    body { font-family: sans-serif; text-align: center; }
    .grupo { margin: 16px 0; }
    .kanji { font-size: 32px; }
    .miniaturas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .miniaturas a { text-decoration: none; color: inherit; font-size: 12px; }
    .miniaturas img { width: 90px; height: 90px; border: 1px solid gray; display: block; }
    </style>
</head>
<body>
    <h1>{{ writer }}: elige el dibujo a retocar</h1>
    <p><a href="{{ url_for('draw', writer=writer) }}">← volver a dibujar</a></p>
    {% for kanji, numbers in drawings %}
    <div class="grupo">
        <div class="kanji" lang="ja">{{ kanji }}</div>
        <div class="miniaturas">
            {% for n in numbers %}
            <a href="{{ url_for('edit', writer=writer, kanji=kanji, n=n) }}">
                <img src="{{ url_for('drawing_png', writer=writer, kanji=kanji, n=n) }}" alt="{{ kanji }} {{ n }}">
                {{ '%02d' % n }}
            </a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</body>
</html>
